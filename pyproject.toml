[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-gate-simulation"
version = "0.1.0"
description = "Course project: reproducible airport gate queue experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
airport-sim = "airport_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
